<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>峇里島探險 · Bali Explorer</title>
    <script type="module" crossorigin src="/bali-explorer/assets/index-CokHQOvy.js"></script>
    <link rel="stylesheet" crossorigin href="/bali-explorer/assets/index-PrXDIsI7.css">
  </head>
  <body>
    <div id="ui">
      <header>
        <h1>峇里島探險</h1>
        <p class="sub">Bali Explorer · 收集行程印章</p>
      </header>
      <div id="hud">
        <div id="progress">印章 <span id="count">0</span> / <span id="total">4</span></div>
        <ul id="checklist"></ul>
        <p id="hint">WASD 移動 · 滑鼠轉向 · 靠近地標按 E 蓋章</p>
      </div>
      <div id="toast" hidden></div>
    </div>
    <div id="overlay" class="panel">
      <h2>峇里島探險</h2>
      <p>開著小綿羊，把行程地標都蓋上印章。</p>
      <ul class="tips">
        <li>DPS 機場</li>
        <li>Seminyak（W Bali）</li>
        <li>Hoshinoya／內陸別墅</li>
        <li>Uluwatu 懸崖</li>
      </ul>
      <p class="controls">鍵盤：WASD 移動、滑鼠看方向、E 互動<br />觸控：虛擬搖桿＋點地標</p>
      <button id="startBtn" type="button">開始探險</button>
    </div>
    <div id="win" class="panel" hidden>
      <h2>行程印章集滿了！</h2>
      <p>DPS → Seminyak → Hoshinoya → Uluwatu，峇里島地圖打卡完成。</p>
      <button id="againBtn" type="button">再玩一次</button>
    </div>
    <div id="joy" aria-hidden="true">
      <div id="joyBase"><div id="joyKnob"></div></div>
      <button id="actionBtn" type="button">E</button>
    </div>
    <canvas id="c"></canvas>
  </body>
</html>
